[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-away"
version = "0.1.0"
description = "Paper-trading AI agent: market data, strategies, risk layer and execution on Alpaca"
requires-python = ">=3.11"
dependencies = [
    "alpaca-py>=0.43",
    "pandas>=2.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.40"]
dev = ["pytest>=8"]

[project.scripts]
trade-away = "trade_away.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
